async function nubeEscribir(cfg, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify({v: 1, at: Date.now(), progreso: P}))));
  const buf = new Uint8Array(12 + ct.length); buf.set(iv); buf.set(ct, 12);
  await gh(cfg, '/gists/' + cfg.gist, {method: 'PATCH', body: JSON.stringify({files: {[NUBE_ARCHIVO]: {content: b64.a(buf)}}})});
}
/* Trae, combina y sube. Con «reemplazar» sube lo de este dispositivo tal cual (tras borrar o importar con «Reemplazar») */
function nubeSincronizar({reemplazar = false} = {}) {
  const cfg = store.get(NUBE, null), c = store.get(CLAVE, null);
  if (!WEB || !cfg || !c) return Promise.resolve();
  clearTimeout(nubeTimer); nubeTimer = null;
  if (nubeEnCurso) return nubeEnCurso.then(() => nubeSincronizar({reemplazar}));
  nubeEnCurso = (async () => {
    try {
      const key = await crypto.subtle.importKey('raw', b64.de(c.aes), 'AES-GCM', false, ['encrypt', 'decrypt']);
      if (!reemplazar) {
        const remoto = await nubeLeer(cfg, key);
        if (remoto?.progreso && combinarProgreso(remoto.progreso)) { store.set(K.progreso, P); if (route !== 'sesion' && !$('#nubeToken')) render(); }
      }
      await nubeEscribir(cfg, key);
      nubeUltima = Date.now();
      nubeEstado = {txt: 'Sincronizado a las ' + new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'}) + '.'};
    } catch (e) {
      nubeEstado = navigator.onLine === false ? {txt: 'Sin conexión: se sincroniza al volver la red.'} : {txt: e.message, error: true, otraClave: !!e.otraClave};
    } finally {
      nubeEnCurso = null;
      if (route === 'progreso' && !$('#nubeToken')) render();
    }
  })();
  return nubeEnCurso;
}
function nubeHTML() {
  const titulo = '<b>Sincronizar entre dispositivos</b>', estado = `<p class="small" id="nubeEstado" role="status"${nubeEstado.error ? ' style="color:var(--ko)"' : ''}>${esc(nubeEstado.txt)}</p>`;
  if (!store.get(NUBE, null)) return `<div class="card" style="margin-top:10px">${titulo}
    <p class="small">Tu progreso (respuestas, fallos, repaso y simulacros) se guarda cifrado con tu contraseña en un Gist secreto de tu cuenta de GitHub, y se combina solo entre el móvil y el ordenador.</p>
    <p class="small">1. <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Fichas%20sincronizaci%C3%B3n" target="_blank" rel="noopener">Crea un token en GitHub</a> con solo el permiso «gist» y caducidad después del examen. 2. Pégalo aquí, en cada dispositivo.</p>
    <div class="field"><input type="password" id="nubeToken" class="campo" placeholder="ghp_…" autocomplete="off" spellcheck="false" aria-label="Token de GitHub"><button class="btn primary" data-act="nubeActivar">Activar</button></div>${estado}</div>`;
  return `<div class="card" style="margin-top:10px"><div class="row">${titulo}<span class="spacer"></span><button class="btn" data-act="nubeAhora">Sincronizar ahora</button></div>
    ${nubeEstado.txt ? estado : '<p class="small" id="nubeEstado" role="status">Activada: se sincroniza al abrir la app y poco después de responder.</p>'}
    ${nubeEstado.otraClave ? `<div class="actions">${holdHTML('nubeReemplazar', 'Mantén para subir el de este dispositivo', 'Subiendo…', 2000, 'danger')}<span class="muted">Sustituye al de GitHub.</span></div>` : ''}
    <div class="actions"><button class="btn ghost" data-act="nubeDesactivar">Desactivar en este dispositivo</button></div></div>`;
}
ACT.nubeActivar = async el => {
  const input = $('#nubeToken'), token = input.value.trim(), est = $('#nubeEstado');
  if (!token) return input.focus();
  el.disabled = true; est.style.color = ''; est.textContent = 'Conectando con GitHub…';
  try {
    const cfg = {token};
    // Si ya lo activaste en otro dispositivo, se usa el mismo Gist
    const g = (await gh(cfg, '/gists?per_page=100')).find(g => g.files && g.files[NUBE_ARCHIVO]);
    cfg.gist = g ? g.id : (await gh(cfg, '/gists', {method: 'POST', body: JSON.stringify({description: 'Fichas · progreso cifrado', public: false, files: {[NUBE_ARCHIVO]: {content: NUBE_VACIO}}})})).id;
    store.set(NUBE, cfg);
    nubeEstado = {txt: ''};
    await nubeSincronizar();
    toast('✓', 'Sincronización activada', g ? 'Combinado con tu otro dispositivo' : 'Actívala también en tu otro dispositivo');
  } catch (e) { est.style.color = 'var(--ko)'; est.textContent = e.message; el.disabled = false; return; }
  render();
};
ACT.nubeAhora = () => nubeSincronizar();
HOLD.nubeReemplazar = () => nubeSincronizar({reemplazar: true});
ACT.nubeDesactivar = () => { store.del(NUBE); nubeEstado = {txt: ''}; toast('−', 'Sincronización desactivada', 'El Gist sigue en tu GitHub'); render(); };
// Al volver a la app trae lo del otro dispositivo; al dejarla, sube lo pendiente
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (nubeTimer) nubeSincronizar(); }
  else if (Date.now() - nubeUltima > 60000) nubeSincronizar();
});
addEventListener('online', () => nubeSincronizar());

/* ==========================================================================
   13. DIÁLOGOS
   ========================================================================== */
function dialog(html) { const d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); d.querySelector('[autofocus], button')?.focus(); }
function reportDialog(rep) {
  if (!rep) return;
  const files = rep.out.map(x => x.error ? `<li><b>${esc(x.file)}</b>: <span style="color:var(--ko)">${esc(x.error)}</span></li>`
    : x.info ? `<li><b>${esc(x.file)}</b>: <span style="color:var(--ink-3)">${esc(x.info)}</span></li>`
    : `<li><b>${esc(x.file)}</b>: ${x.kind === 'csv' ? (x.replaced ? 'actualizado (tu progreso se mantiene)' : 'cargado') : `enunciados de ${plural(x.sups.length, 'supuesto', 'supuestos')}`}</li>`).join('');
  const banks = rep.bancos.map(bankByPrefix).filter(Boolean).map(b => {
    const lines = [];
    if (!b.hasCsv) lines.push(`<span style="color:var(--warn)">Falta ${esc(b.prefix)}.csv: los enunciados esperan a su CSV.</span>`);
    else {
      lines.push(`${b.questions.length + b.twins.length + b.dups.length + b.invalid.length} filas: ${b.questions.length + b.twins.length} válidas${b.invalid.length ? `, <b style="color:var(--ko)">${b.invalid.length} inválidas</b>` : ''}${b.dups.length ? `, ${b.dups.length} con id repetido (ignoradas)` : ''}.`);
      if (b.twins.length) lines.push(`<br><span style="color:var(--accent)">${twinsTxt(b)}</span>`);
      if (b.supNums.length) lines.push(b.supSinEnunciado.length ? `<span style="color:var(--ko)">Sin enunciado: supuesto ${b.supSinEnunciado.join(', ')}.</span>` : `Supuestos ${b.supNums.join(' y ')} emparejados con su enunciado.`);
      if (b.enunciadoSinPreguntas.length) lines.push(`<span style="color:var(--warn)">El .md trae el supuesto ${b.enunciadoSinPreguntas.join(', ')} sin preguntas en el CSV.</span>`);
    }
    const det = [...b.invalid.map(r => `Fila ${r.line} (${esc(r.id)}): ${esc(r.reasons.join('; '))}`), ...b.dups.map(d => `${esc(d.id)}: ya existe en ${esc(d.owner)}; se ignora`), ...b.warnings.map(esc)];
    return `<li><b>${esc(bankName(b))}</b> (${b.turno}) — ${lines.join(' ')}${det.length ? `<ul class="small">${det.slice(0, 60).map(x => `<li>${x}</li>`).join('')}${det.length > 60 ? `<li>…y ${det.length - 60} más (en Bancos)</li>` : ''}</ul>` : ''}</li>`;
  }).join('');
  dialog(`<h3 id="dlgTitle">Informe de carga</h3><ul class="report small" style="padding-left:1.2em">${files}</ul>${banks ? `<ul class="report" style="padding-left:1.2em">${banks}</ul>` : ''}
    ${rep.guardado ? '' : '<div class="storage-warn">No se pudo guardar en el navegador (¿sin espacio o bloqueado?). Los bancos funcionan mientras la pestaña siga abierta.</div>'}
    <div class="actions"><button class="btn primary" data-act="dlgClose" autofocus>Entendido</button></div>`);
}
function anuladasDialog() {
  const qs = LIB.banks.flatMap(b => b.questions.filter(q => q.anulada));
  dialog(`<h3 id="dlgTitle">Preguntas anuladas (${qs.length})</h3><p class="small">No puntúan y no salen en los tests.</p>
    ${qs.map(q => `<div class="review-item"><article class="fcard"><div class="meta">${metaHTML(q)}</div><p class="qtext">${esc(q.pregunta)}</p><div class="opts">${optsHTML(q, {checked: true})}</div>${q.nota.trim() ? `<p class="small" style="margin-top:10px">${esc(q.nota)}</p>` : ''}</article></div>`).join('')}
    <div class="actions"><button class="btn primary" data-act="dlgClose">Cerrar</button></div>`);
}
function salirDialog() {
  const sim = S.kind === 'simulacro', reloj = !!curPart().endAt;
  dialog(`<h3 id="dlgTitle">¿Salir de ${esc(S.title.toLowerCase())}?</h3>
    <p>${reloj ? 'Puedes salir y volver desde Inicio, pero el reloj sigue corriendo: si se acaba, se entrega solo.' : 'Puedes salir y seguir luego desde Inicio, o terminar ahora y ver la corrección.'}</p>
    <div class="actions"><button class="btn" data-act="dlgClose" autofocus>Seguir aquí</button><button class="btn" data-act="salirLuego">Salir y seguir luego</button>
    ${sim ? holdHTML('entregarYa', 'Mantén para entregar ya', 'Entregando…', 2000) : '<button class="btn primary" data-act="terminarYa">Terminar y corregir</button>'}</div>`);
}
ACT.salirLuego = () => { $('#dlg').close(); go('inicio'); };
ACT.terminarYa = () => { $('#dlg').close(); finish(); };
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });   // clic fuera cierra

/* ==========================================================================
   14. EXPORTAR / IMPORTAR
   ========================================================================== */
function exportar() {
  const data = {app: 'fichas-oposicion', version: 1, exportado: new Date().toISOString(), progreso: P, preferencias: UI};
  if (UI.expBancos !== false) data.bancos = store.get(K.bancos, {});
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `progreso-oposicion-${dayKey()}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('↓', 'Progreso exportado', a.download);
}
let PENDING_IMPORT = null;
$('#importInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { return dialog(`<h3 id="dlgTitle">No se puede importar</h3><p>${esc(f.name)} no es un JSON válido.</p><div class="actions"><button class="btn primary" data-act="dlgClose">Cerrar</button></div>`); }
  if (!data || data.app !== 'fichas-oposicion' || !data.progreso || typeof data.progreso.q !== 'object')
    return dialog(`<h3 id="dlgTitle">No se puede importar</h3><p>${esc(f.name)} no parece una exportación de esta app.</p><div class="actions"><button class="btn primary" data-act="dlgClose">Cerrar</button></div>`);
  PENDING_IMPORT = data;
  const pr = data.progreso, nb = data.bancos ? Object.keys(data.bancos).length : 0;
  dialog(`<h3 id="dlgTitle">Importar progreso</h3>
    <p>${esc(f.name)} · exportado el ${esc(new Date(data.exportado).toLocaleString('es-ES'))}</p>
    <div class="card kv"><span>Preguntas con historial</span><span>${Object.keys(pr.q).length}</span><span>Días estudiados</span><span>${Object.keys(pr.days || {}).length}</span><span>Simulacros</span><span>${(pr.sims || []).length}</span><span>Bancos incluidos</span><span>${nb}</span></div>
    <p class="small">«Combinar» conserva lo que tienes y añade lo del archivo (en cada pregunta se queda el historial más reciente). «Reemplazar» deja el progreso exactamente como en el archivo. Los bancos del archivo se añaden en los dos casos.</p>
    <div class="actions"><button class="btn" data-act="dlgClose">Cancelar</button><button class="btn" data-act="importReplace">Reemplazar</button><button class="btn primary" data-act="importMerge" autofocus>Combinar</button></div>`);
});
function applyImport(mode) {
  const d = PENDING_IMPORT; if (!d) return;
  const imp = {q: d.progreso.q || {}, days: d.progreso.days || {}, sims: d.progreso.sims || []};
  if (mode === 'replace') P = {v: 1, ...imp};
  else combinarProgreso(imp);
  if (d.bancos && typeof d.bancos === 'object') { const raw = store.get(K.bancos, {}); Object.assign(raw, d.bancos); store.set(K.bancos, raw); buildLibrary(); }
  saveProgress(); PENDING_IMPORT = null; $('#dlg').close();
  if (mode === 'replace') nubeSincronizar({reemplazar: true});
  toast('↑', mode === 'replace' ? 'Progreso reemplazado' : 'Progreso combinado', `${Object.keys(P.q).length} preguntas con historial`);
  render();
}
ACT.importMerge = () => applyImport('merge');
ACT.importReplace = () => applyImport('replace');

/* ==========================================================================
   15. AVISOS APILADOS (al estilo Sonner): entran y salen por abajo,
       se pausan con la pestaña oculta o con el ratón encima
   ========================================================================== */
const toaster = $('#toaster');
let toastPaused = false;
function toast(icon, title, sub) {
  const t = document.createElement('div');
  t.className = 'toast'; t.dataset.mounted = 'false'; t.setAttribute('role', 'status');
  t.innerHTML = `<span class="em" aria-hidden="true">${esc(icon)}</span><span><b></b><small></small></span>`;
  t.querySelector('b').textContent = title; t.querySelector('small').textContent = sub || '';
  t._left = 4000; t._start = Date.now();
  toaster.prepend(t); restack();
  void t.offsetWidth; t.dataset.mounted = 'true';                  // transición: interrumpible
  if (!toastPaused) t._timer = setTimeout(() => leave(t), t._left);
}
function leave(t) { if (t.dataset.leaving) return; t.dataset.leaving = 'true'; setTimeout(() => { t.remove(); restack(); }, reduceMotion() ? 0 : 200); }
function restack() { [...toaster.children].forEach((t, i) => { t.style.setProperty('--i', i); t.style.zIndex = 10 - i; if (i > 2) leave(t); }); }
function pauseToasts(on) {
  toastPaused = on;
  for (const t of toaster.children) {
    if (on) { clearTimeout(t._timer); t._left -= Date.now() - t._start; }
    else { t._start = Date.now(); t._timer = setTimeout(() => leave(t), Math.max(600, t._left)); }
  }
}
toaster.addEventListener('mouseenter', () => pauseToasts(true));
toaster.addEventListener('mouseleave', () => pauseToasts(false));
document.addEventListener('visibilitychange', () => pauseToasts(document.hidden));
const announce = txt => { const l = $('#live'); l.textContent = ''; setTimeout(() => l.textContent = txt, 30); };

/* ==========================================================================
   16. ARRANQUE
   ========================================================================== */
applyTheme();
buildLibrary();
/* La opción fallada se guarda desde la versión con informe de fallos; la de la última sesión aún se puede recuperar */
if (S && S.ans && S.recorded) {
  let n = 0;
  for (const [id, L] of Object.entries(S.ans)) {
    const e = P.q[id], q = LIB.byId.get(id);
    if (e && e.ko && !e.marcada && q && S.recorded[id] && L !== q.oficial) { e.marcada = L; n++; }
  }
  if (n) saveProgress();
}
if (S && !S.done && !S.between) {
  const part = S.parts[S.p];
  if (part && part.endAt && part.endAt <= Date.now()) { route = 'sesion'; deliverPart(true); }
}
go(S && !S.done ? 'sesion' : 'inicio', {instant: true});
addEventListener('resize', () => clipTabs(true));
if (WEB) {
  arrancarWeb();
  // Instalable y sin conexión (sw.js). Pedir almacenamiento persistente evita que el navegador
  // borre el progreso por falta de espacio o por no abrir la app en unos días
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.storage?.persist?.().catch(() => {});
}
</script>
