<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeebe5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121211">
<title>Fichas · Tests de oposición</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichas">
<script>
/* Aplica el tema elegido antes de pintar nada, para que no parpadee */
try { var t = (JSON.parse(localStorage.getItem('fichas.ui.v1')) || {}).tema; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
/* Solo en la versión publicada: el manifiesto (para instalarla; con doble clic el navegador lo bloquearía)
   y, si este dispositivo aún no tiene la contraseña, la app queda tapada hasta escribirla */
if (/^https?:$/.test(location.protocol)) {
  document.write('<link rel="manifest" href="manifest.webmanifest">');
  try { if (!localStorage.getItem('fichas.clave.v1')) document.documentElement.classList.add('bloqueada'); } catch (e) { document.documentElement.classList.add('bloqueada'); }
}
</script>
<style>
/* ==========================================================================
   FICHAS · app local para practicar tests de oposición
   Un único archivo, sin dependencias. Funciona con doble clic (file://).
   Diseño: boceto 5 ("Fichas"). Movimiento según emil-design-eng:
   - nada se anima si lo dispara el teclado;
   - pulsar responde al instante (scale .97);
   - entradas y salidas ≤ 240 ms con ease-out fuerte, por transición;
   - lo irreversible se confirma manteniendo pulsado;
   - :hover solo con puntero fino; reduced motion = solo fundidos.
   ========================================================================== */
:root{
  --bg:#eeebe5; --card:#fbfaf7; --card-2:#f3f0e9; --ink:#17171a; --ink-2:#55524c; --ink-3:#6c685f; --line:#d9d3c7;
  --accent:#2a43d6; --accent-soft:rgba(42,67,214,.1); --ok:#0f7a47; --ok-soft:rgba(15,122,71,.11); --ko:#c2321f; --ko-soft:rgba(194,50,31,.1);
  --warn:#8f5400; --warn-soft:rgba(143,84,0,.12); --hl:#ffe46b; --hl-ink:#17171a; --on-solid:#fff;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --display:"Aptos Display","Segoe UI Variable Display","SF Pro Display",-apple-system,system-ui,sans-serif;
  --text:"Aptos","Segoe UI Variable Text","SF Pro Text",-apple-system,system-ui,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 2px 6px rgba(40,30,10,.06),0 12px 28px -12px rgba(40,30,10,.18);
}
/* Tema: «automático» sigue al sistema; data-theme="light"/"dark" en <html> lo fija a mano */
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#121211; --card:#1c1c1b; --card-2:#252523; --ink:#f1efe9; --ink-2:#bdb8ae; --ink-3:#98938a; --line:#36352f;
  --accent:#9aa8ff; --accent-soft:rgba(154,168,255,.15); --ok:#55d995; --ok-soft:rgba(85,217,149,.13); --ko:#ff8572; --ko-soft:rgba(255,133,114,.13);
  --warn:#f2b552; --warn-soft:rgba(242,181,82,.14); --hl:#ffe46b; --hl-ink:#17171a; --on-solid:#121211;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 28px -12px rgba(0,0,0,.6);
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#121211; --card:#1c1c1b; --card-2:#252523; --ink:#f1efe9; --ink-2:#bdb8ae; --ink-3:#98938a; --line:#36352f;
  --accent:#9aa8ff; --accent-soft:rgba(154,168,255,.15); --ok:#55d995; --ok-soft:rgba(85,217,149,.13); --ko:#ff8572; --ko-soft:rgba(255,133,114,.13);
  --warn:#f2b552; --warn-soft:rgba(242,181,82,.14); --hl:#ffe46b; --hl-ink:#17171a; --on-solid:#121211;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 var(--text)}
button,a,label.chip{touch-action:manipulation;font:inherit;color:inherit}
button,.chip,.tabs{-webkit-user-select:none;user-select:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em}
.small{font-size:13px;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 11px var(--text);min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--ink-2);background:var(--card)}
h1{font:800 clamp(30px,5vw,40px)/1.05 var(--display);letter-spacing:-.03em;margin:10px 0 6px}
h2{font:700 13px var(--text);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:30px 0 10px}
h3{font:800 20px/1.2 var(--display);letter-spacing:-.02em;margin:0}
p{margin:.4em 0}
.press{transition:transform 120ms var(--ease-out)}
.press:active{transform:scale(.97)}

/* ---------- Pestañas con indicador por clip-path ---------- */
.tabs-wrap{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.tabs-scroll{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.theme-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:transform 120ms var(--ease-out)}
.theme-btn:active{transform:scale(.97)}
.theme-btn svg{width:16px;height:16px}
@media (max-width:640px){.theme-btn span{display:none}.theme-btn{padding:7px}}
.tabs{position:relative;display:inline-flex;min-width:max-content}
.tabs ul{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs .active{position:absolute;inset:0;pointer-events:none;transition:clip-path 240ms var(--ease-out)}
.tabs .active button{background:var(--ink);color:var(--bg)}
body.focus .tabs-wrap{display:none}
main{max-width:780px;margin:0 auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 120px)}
.storage-warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 0}

/* ---------- Entrada escalonada (solo la 1.ª vez del día) ---------- */
.stagger>*{opacity:0;transform:translateY(8px);animation:rise 320ms var(--ease-out) forwards}
.stagger>*:nth-child(2){animation-delay:50ms}.stagger>*:nth-child(3){animation-delay:100ms}.stagger>*:nth-child(4){animation-delay:150ms}.stagger>*:nth-child(n+5){animation-delay:200ms}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- Comunes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform 120ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn[aria-pressed=true]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.big{padding:14px 20px;border-radius:99px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tag.des{background:var(--accent-soft);color:var(--accent)}.tag.dud{background:var(--warn-soft);color:var(--warn)}
.tag.anu{background:var(--ko-soft);color:var(--ko)}.tag.res{background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.fdt{background:var(--card-2);color:var(--ink-2);border:1px dashed var(--ink-3)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.warn-box{background:var(--warn-soft);border-radius:14px;padding:12px 14px;color:var(--ink);font-size:15px}
.warn-box b{color:var(--warn)}
.info-box{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:15px}
/* Interruptor */
.switch{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.switch input{appearance:none;width:46px;height:28px;flex:none;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background-color 200ms ease;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 220ms var(--ease-out)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}
.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.switch span b{display:block;font-weight:600}
.switch span small{display:block;font-size:13px;color:var(--ink-2)}
/* Mantener pulsado para confirmar */
.hold{position:relative;overflow:hidden;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;transition:transform 120ms var(--ease-out)}
.hold:active{transform:scale(.97)}
.hold .fill{position:absolute;inset:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--ease-out)}
.hold.holding .fill{clip-path:inset(0 0 0 0);transition:clip-path var(--hold,1.5s) linear}
.hold.danger{border-color:var(--ko);color:var(--ko)}.hold.danger .fill{background:var(--ko);color:var(--on-solid)}

/* ---------- INICIO ---------- */
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin:8px 0 22px}
.days{font-size:clamp(84px,17vw,148px);line-height:.82}
.days small{display:block;font:500 15px var(--text);letter-spacing:0;color:var(--ink-2);margin-top:12px}
.streak{text-align:right}
.streak .num{font-size:44px;line-height:1}
.ticks{display:flex;gap:3px;justify-content:flex-end;margin-top:8px}
.ticks i{width:6px;height:18px;border-radius:2px;background:var(--line)}
.ticks i.on{background:var(--ink)}
.ticks i.today{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ticks i.today.on{background:var(--ink)}
.deck{position:relative;margin:6px 0 22px}
.deck .f{position:absolute;inset:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform 260ms var(--ease-out)}
.deck .f:nth-child(1){transform:rotate(-3.5deg) translateY(10px) scale(.94)}
.deck .f:nth-child(2){transform:rotate(2.5deg) translateY(5px) scale(.97)}
.deck .f.front{position:relative;inset:auto;min-height:180px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding:22px;text-align:left;cursor:pointer;width:100%;color:inherit}
.deck .f.front .num{font-size:64px;line-height:.9;display:block}
.deck .f.front b{display:block;font:700 22px/1.15 var(--display);letter-spacing:-.02em;margin-top:6px}
.go{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:99px;padding:12px 18px;font-weight:700;white-space:nowrap}
.goal{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-2);margin:18px 0 18px}
.goal .track{flex:1;height:6px;border-radius:3px;background:var(--card-2);overflow:hidden}
.goal .track i{display:block;height:100%;background:var(--ok);border-radius:3px}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--hl);color:var(--hl-ink);border-radius:16px;padding:12px 16px;margin-bottom:16px}
.resume .btn{background:var(--hl-ink);color:#fff;border-color:var(--hl-ink)}
.modes{display:grid;border-top:1px solid var(--line)}
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.mode b{font:700 18px var(--display);letter-spacing:-.015em}
.mode span span{display:block;font-size:13px;color:var(--ink-2)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.bars .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch}
.bars .track{position:relative;height:10px;border-radius:5px;background:var(--card-2);overflow:hidden}
.bars .track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--ink)}
.bars .track i.low{background:var(--ko)}
.bars .track::after{content:"";position:absolute;left:60%;top:0;bottom:0;border-left:1.5px dashed var(--ink-3)}
.bars .p{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;white-space:nowrap}
.bars .p.low{color:var(--ko);font-weight:700}
.drop{border:1.5px dashed var(--ink-3);border-radius:18px;padding:26px;text-align:center;background:var(--card);cursor:pointer;transition:transform 200ms var(--ease-out),border-color 150ms ease,background-color 150ms ease;display:block;width:100%}
.drop.over{transform:scale(1.01);border-color:var(--accent);background:var(--accent-soft)}
.drop-overlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;place-items:center;font:800 28px var(--display);opacity:0;pointer-events:none;transition:opacity 150ms ease}
.drop-overlay.on{opacity:1}

/* ---------- Configurar práctica ---------- */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tema{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;cursor:pointer;min-height:64px;transition:transform 120ms var(--ease-out)}
.tema:active{transform:scale(.97)}
.tema b{font:800 15px var(--display);display:flex;justify-content:space-between;gap:6px}
.tema b span{font:600 12px var(--text);color:var(--ink-3)}
.tema small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;color:var(--ink-2);margin-top:2px}
.tema[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card-2)}
.tema[aria-pressed=true] b::after{content:"✓";font-size:13px}
.tema[disabled]{opacity:.4;cursor:not-allowed}
.tema.low b{color:var(--ko)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.field input[type=number]{width:90px;font:600 16px var(--text);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.stickybar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);margin-top:24px;padding:10px 12px;border-radius:99px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow);width:max-content;max-width:100%}
.need{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:15px}
.need .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.need .v.bad{color:var(--ko)}.need .v.good{color:var(--ok)}
.bank-list{display:grid;gap:8px}
.bank-mini{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.bank-mini .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}

/* ---------- Ficha de pregunta ---------- */
.sbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sbar .chip{cursor:default}
.sbar .timer{margin-left:auto;font-weight:800;font-family:var(--display);font-size:17px;color:var(--ink);letter-spacing:-.01em}
.sbar .timer.low{color:var(--ko)}
.progress{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ink);transform-origin:left}
.pile{position:relative;padding-bottom:26px}
.pile::before,.pile::after{content:"";position:absolute;left:0;right:0;top:0;bottom:26px;border-radius:22px;background:var(--card);border:1px solid var(--line);z-index:0}
.pile::before{transform:translateY(26px) scale(.94);opacity:.55}
.pile::after{transform:translateY(14px) scale(.97);opacity:.85}
.pile.last::before{display:none}.pile.only::before,.pile.only::after{display:none}
.fcard{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(18px,4vw,34px);transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.fcard.out{transform:translateY(-10px) scale(.98);opacity:0}
.fcard.in{transform:translateY(10px) scale(.97);opacity:.4;transition:none}
.fcard:focus{outline:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.meta .tema-code{font-weight:800;color:var(--hl-ink);background:var(--hl);padding:1px 7px;border-radius:5px}
.qtext{font:600 clamp(19px,2.6vw,23px)/1.45 var(--display);letter-spacing:-.012em;margin:0 0 22px;white-space:pre-line;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px 12px 12px;font-size:17px;line-height:1.4;cursor:pointer;
  transition:transform 120ms var(--ease-out),border-color 150ms ease,background-color 150ms ease}
.opt:active{transform:scale(.985)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--card-2);font-weight:800;font-size:13px;color:var(--ink-2)}
.opt .t{white-space:pre-line}
.opt .who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed=true] .k{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:none}.opt.right .k{background:var(--ok);color:var(--on-solid)}.opt.right .who{color:var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft);box-shadow:none}.opt.wrong .k{background:var(--ko);color:var(--on-solid)}.opt.wrong .who{color:var(--ko)}
.opt.dim{opacity:.6}
.opt[disabled]{cursor:default;color:inherit}
.kbd,.kbd *{transition:none!important}
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease-out)}
.reveal.open{grid-template-rows:1fr}
.reveal>div{overflow:hidden;min-height:0}
.explain{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:15px}
.explain .head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.verdict{font:800 18px var(--display);letter-spacing:-.01em}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.note.dud{background:var(--warn-soft)}
.note p{margin:.25em 0}
.note .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
details.more{margin-top:10px;font-size:13px;color:var(--ink-2)}
details.more summary{cursor:pointer;font-weight:600}
details.more p{word-break:break-word}
.doubt{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease-out)}
.doubt:active{transform:scale(.97)}
.doubt .chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:10px;color:transparent;transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease}

/* ---------- Resultado ---------- */
.ticket{max-width:480px;margin:8px auto 0;background:var(--card);border:1px solid var(--line);border-radius:6px 6px 0 0;box-shadow:var(--shadow);padding:26px 24px 30px;position:relative;
  --m:radial-gradient(circle at 8px 0,transparent 7px,#000 7.5px);-webkit-mask:var(--m) 0 100%/16px 100% repeat-x,linear-gradient(#000 0 0) 0 0/100% calc(100% - 8px) no-repeat;mask:var(--m) 0 100%/16px 100% repeat-x,linear-gradient(#000 0 0) 0 0/100% calc(100% - 8px) no-repeat}

@media print{

    --accent:#2a43d6!important;--accent-soft:rgba(42,67,214,.1)!important;--ok:#0f7a47!important;--ok-soft:rgba(15,122,71,.11)!important;--ko:#c2321f!important;--ko-soft:rgba(194,50,31,.1)!important;

  transition:transform 400ms ease,opacity 400ms ease;transform:translateY(calc(var(--i) * -10px)) scale(calc(1 - var(--i) * .05));opacity:calc(1 - var(--i) * .25)}
.toast[data-mounted=false]{transform:translateY(120%);opacity:0}

<script>
'use strict';
/* ==========================================================================
   1. CONFIGURACIÓN Y UTILIDADES
   ========================================================================== */
const FECHA_EXAMEN = new Date(2027, 0, 23);          // fecha objetivo de la cuenta atrás
const K = { bancos: 'fichas.bancos.v1', progreso: 'fichas.progreso.v1', sesion: 'fichas.sesion.v1', ui: 'fichas.ui.v1' };
const TEMAS_C = ['C1','C2','C3','C4','C5','C6','C7','C8'];
const TEMAS_T = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12','T13','T14'];
const TEMAS = [...TEMAS_C, ...TEMAS_T];
const FDT = 'FUERA DE TEMARIO';
const DIA = 864e5;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad2 = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fmt = (n, d = 2) => (Math.abs(n) < 5e-10 ? 0 : n).toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const collator = new Intl.Collator('es', {numeric: true, sensitivity: 'base'});
const temaOrden = t => { const i = TEMAS.indexOf(t); return i < 0 ? 99 : i; };
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function daysToExam() { const n = new Date(); return Math.round((FECHA_EXAMEN - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / DIA); }

/* Almacenamiento: cada acceso a localStorage va en try/catch.
   Si falla (modo privado, cuota llena, bloqueado), la app sigue con una copia en memoria. */
const store = {
  ok: true, mem: {},
  get(k, def) {
    try {
      const v = localStorage.getItem(k);
      if (v == null) return k in this.mem ? this.mem[k] : def;
      return JSON.parse(v);
    } catch (e) { this.ok = false; return k in this.mem ? this.mem[k] : def; }
  },
  set(k, v) {
    this.mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { this.ok = false; this.error = e; return false; }
  },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch (e) { this.ok = false; } }
};

/* ==========================================================================
   2. PARSER CSV (RFC 4180, separador «;», comillas dobles, saltos dentro de campo)
   ========================================================================== */
function parseCSV(text, sep = ';') {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);            // BOM
  const rows = []; let row = [], field = '', inQ = false, line = 1, rowLine = 1;
  const endField = () => { row.push(field.replace(/\r\n?/g, '\n')); field = ''; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else { if (c === '\n') line++; field += c; }
    } else if (c === '"') inQ = true;
    else if (c === sep) endField();
    else if (c === '\r') { /* parte de CRLF */ }
    else if (c === '\n') { endField(); rows.push({cells: row, line: rowLine}); row = []; line++; rowLine = line; }
    else field += c;
  }
  if (field !== '' || row.length) { endField(); rows.push({cells: row, line: rowLine}); }
  return {rows, unterminated: inQ};
}

/* ==========================================================================
   3. BANCOS: lectura, validación y metadatos (nada concreto en el código:
      todo se deduce del nombre del archivo y de sus filas)
   ========================================================================== */
const COLUMNAS = ['id','examen','parte','tema','epigrafe','n_opciones','pregunta','A','B','C','D','respuesta_oficial','estado','respuesta_actual','fuente','nota'];
const PARTES = ['comun','especifica','reserva','supuesto'];
const ESTADOS = ['VIGENTE','DESACTUALIZADA','DUDOSA'];

/* «2025_MINISTERIO_L» → año, organismo y turno */
function bankMeta(prefix) {
  const m = prefix.match(/^(\d{4})_(.+)_(L|PI)$/i);
  const title = s => s.replace(/_/g, ' ');            // tal cual: suelen ser siglas (MPT, MITECO…)
  if (m) return {year: m[1], org: title(m[2]), turno: m[3].toUpperCase()};
  return {year: '', org: prefix, turno: /_PI$/i.test(prefix) ? 'PI' : /_L$/i.test(prefix) ? 'L' : '?'};
}
const turnoTxt = t => t === 'L' ? 'Acceso libre' : t === 'PI' ? 'Promoción interna' : 'Turno sin identificar';
const bankName = b => b.year ? `${b.year} · ${b.org}` : b.org;

function parseBankCSV(prefix, text) {
  const res = {questions: [], invalid: [], warnings: [], fatal: null};
  const {rows, unterminated} = parseCSV(text);
  if (!rows.length) { res.fatal = 'El archivo está vacío.'; return res; }
  const head = rows[0].cells.map(h => h.trim());
  const col = {};
  COLUMNAS.forEach(c => col[c] = head.findIndex(h => h.toLowerCase() === c.toLowerCase()));
  const missing = COLUMNAS.filter(c => col[c] < 0);
  if (missing.length) { res.fatal = `Faltan columnas: ${missing.join(', ')}. ¿Está separado por punto y coma?`; return res; }
  if (unterminated) res.warnings.push('El archivo termina con unas comillas sin cerrar: puede faltar el final.');
  const seen = new Set();
  for (const r of rows.slice(1)) {
    if (r.cells.every(c => !c.trim())) continue;                       // filas vacías
    const g = c => r.cells[col[c]] ?? '';
    const q = {
      id: g('id').trim(), examen: g('examen').trim(), parte: g('parte').trim().toLowerCase(),
      tema: g('tema').trim().toUpperCase(), epigrafe: g('epigrafe').trim(), n: parseInt(g('n_opciones'), 10),
      pregunta: g('pregunta'), A: g('A'), B: g('B'), C: g('C'), D: g('D'),
      oficial: g('respuesta_oficial').trim().toUpperCase(), estado: (g('estado').trim().toUpperCase() || 'VIGENTE'),
      actual: g('respuesta_actual'), fuente: g('fuente'), nota: g('nota'), bank: prefix, line: r.line
    };
    const errs = [];
    if (!q.id) errs.push('sin id');
    else if (seen.has(q.id)) errs.push('id repetido en este archivo');
    if (r.cells.length !== head.length) errs.push(`tiene ${r.cells.length} columnas y la cabecera ${head.length}`);
    if (!PARTES.includes(q.parte)) errs.push(`parte desconocida «${q.parte || 'vacía'}»`);
    if (q.n !== 3 && q.n !== 4) errs.push(`n_opciones debe ser 3 o 4 (es «${g('n_opciones')}»)`);
    if (!q.pregunta.trim()) errs.push('pregunta vacía');
    const letras = q.n === 3 ? ['A','B','C'] : ['A','B','C','D'];
    letras.forEach(L => { if (!q[L].trim()) errs.push(`opción ${L} vacía`); });
    if (!q.oficial) errs.push('sin respuesta oficial');
    else if (q.oficial !== 'ANULADA' && !letras.includes(q.oficial)) errs.push(`respuesta oficial «${q.oficial}» no válida`);
    if (q.parte === 'supuesto') {
      const m = q.id.match(/_S(\d+)_(\d+)$/i);
      if (!m) errs.push('el id de supuesto no termina en _S<n>_<nn>'); else { q.sup = +m[1]; q.supPos = +m[2]; }
    }
    if (q.id) seen.add(q.id);
    if (errs.length) { res.invalid.push({line: r.line, id: q.id || '—', reasons: errs}); continue; }
    if (!ESTADOS.includes(q.estado)) { res.warnings.push(`Fila ${r.line} (${q.id}): estado «${q.estado}» desconocido, se trata como VIGENTE.`); q.estado = 'VIGENTE'; }
    if (!TEMAS.includes(q.tema) && q.tema !== FDT) res.warnings.push(`Fila ${r.line} (${q.id}): tema «${q.tema}» fuera de C1–C8 y T1–T14.`);
    if (q.n === 3 && q.D.trim()) res.warnings.push(`Fila ${r.line} (${q.id}): tiene 3 opciones pero la D no está vacía; se ignora la D.`);
    q.anulada = q.oficial === 'ANULADA';
    q.fuera = q.tema === FDT;
    // Reservas: las de la parte 1 y las dos últimas de cada supuesto (posiciones 11 y 12)
    q.reserva = q.parte === 'reserva' || (q.parte === 'supuesto' && q.supPos > 10);
    q.bloque = q.parte === 'comun' ? 'C' : q.parte === 'especifica' ? 'T' : q.parte === 'reserva' ? (q.tema.startsWith('C') ? 'C' : 'T') : 'S';

  }

}

/* Reservas que sustituyen a anuladas: en orden, dentro de su bloque
   (común con común, específica con específica, cada supuesto con el suyo). */
function markSubstitutes(qs) {
  const byId = (a, b) => collator.compare(a.id, b.id);
  for (const blk of ['C', 'T']) {
    const anuladas = qs.filter(q => !q.reserva && q.bloque === blk && q.anulada).length;
    qs.filter(q => q.parte === 'reserva' && q.bloque === blk && !q.anulada).sort(byId).slice(0, anuladas).forEach(q => q.sustituye = true);
  }
  const sups = new Set(qs.filter(q => q.parte === 'supuesto').map(q => q.sup));
  for (const s of sups) {
    const its = qs.filter(q => q.parte === 'supuesto' && q.sup === s);
    const anuladas = its.filter(q => !q.reserva && q.anulada).length;
    its.filter(q => q.reserva && !q.anulada).sort((a, b) => a.supPos - b.supPos).slice(0, anuladas).forEach(q => q.sustituye = true);
  }
}

/* *_supuestos.md → {número: {enunciado (markdown)}} */
function parseSupuestosMD(text) {
  text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const out = {}, parts = text.split(/^##[ \t]+Supuesto[ \t]+(\d+)[ \t]*$/m);
  for (let i = 1; i < parts.length; i += 2) {
    const body = parts[i + 1] || '';
    const m = body.match(/^###[ \t]+Enunciado completo[ \t]*\n([\s\S]*?)(?=^###[ \t]|(?![\s\S]))/m);
    if (m && m[1].trim()) out[+parts[i]] = {enunciado: m[1].trim()};
  }
  return out;
}

/* Markdown mínimo y seguro (se escapa todo antes): párrafos, listas anidadas, tablas, negrita, código y enlaces */
function mdToHtml(src) {
  const lines = src.split('\n'), out = [];
  for (let i = 0; i < lines.length; i++) {
    // Tablas: líneas seguidas que empiezan por «|»; la segunda puede ser la separadora «|---|---|»
    if (/^\s*\|/.test(lines[i])) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      out.push({table: rows});
    } else out.push(lines[i]);
  }
  return mdBlocks(out);
}
function mdTable(rows, inline) {
  const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
  const sep = rows.length > 1 && /^\s*\|?\s*:?-{3,}/.test(rows[1]);
  const head = sep ? cells(rows[0]) : null, body = (sep ? rows.slice(2) : rows).map(cells);
  const align = sep ? cells(rows[1]).map(c => /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : '') : [];
  const td = (tag, c, j) => `<${tag}${align[j] ? ` style="text-align:${align[j]}"` : ''}>${inline(c)}</${tag}>`;
  return `<div class="tbl" tabindex="0"><table>${head ? `<thead><tr>${head.map((c, j) => td('th', c, j)).join('')}</tr></thead>` : ''}<tbody>${body.map(r => `<tr>${r.map((c, j) => td('td', c, j)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function mdBlocks(src) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  let html = '', para = []; const stack = [];
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const closeTo = ind => { while (stack.length && stack[stack.length - 1].ind > ind) html += '</li></' + stack.pop().type + '>'; };
  for (const raw of src) {
    if (raw.table) { flush(); closeTo(-1); html += mdTable(raw.table, inline); continue; }
    const li = raw.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      flush();
      const ind = li[1].replace(/\t/g, '    ').length, type = /\d/.test(li[2]) ? 'ol' : 'ul';
      const open = () => { html += `<${type}${type === 'ol' ? ` start="${parseInt(li[2], 10)}"` : ''}><li>`; stack.push({type, ind}); };
      const top = stack[stack.length - 1];
      if (!top || ind > top.ind) open();
      else {
        closeTo(ind); const t = stack[stack.length - 1];
        if (t && t.ind === ind && t.type === type) html += '</li><li>';
        else { if (t && t.ind === ind) html += '</li></' + stack.pop().type + '>'; open(); }
      }
      html += inline(li[3]); continue;
    }
    if (!raw.trim()) { flush(); continue; }
    const h = raw.match(/^#{1,6}\s+(.*)$/);
    if (h) { flush(); closeTo(-1); html += `<h4>${inline(h[1])}</h4>`; continue; }
    if (stack.length && /^\s+/.test(raw)) { html += ' ' + inline(raw.trim()); continue; }
    closeTo(-1); para.push(raw.trim());
  }
  flush(); closeTo(-1);
  return html;
}

/**
 * Puntúa un bloque de preguntas.
 * @param {{marcada: (string|null), oficial: string}[]} respuestas
 * @param {number} valor  puntos por acierto (0,5 en la parte 1, 3 en la parte 2, 1 en práctica)
 * Cada fallo resta 1/3 del valor de un acierto; los blancos no restan; las ANULADAS no cuentan.
 */
function puntuar(respuestas, valor = 1) {
  let aciertos = 0, fallos = 0, blancos = 0, anuladas = 0;
  for (const r of respuestas) {
    if (r.oficial === 'ANULADA') { anuladas++; continue; }
    if (!r.marcada) blancos++;
    else if (r.marcada === r.oficial) aciertos++;
    else fallos++;
  }
  const puntuables = aciertos + fallos + blancos;
  const netos = aciertos - fallos / 3;
  return {aciertos, fallos, blancos, anuladas, puntuables, netos, puntos: netos * valor, maximo: puntuables * valor};
}

/**
 * Resultado de un simulacro.
 * Parte 1 = común + específica (0,5 por pregunta); parte 2 = supuestos (3 por pregunta).
 * Mínimos: la mitad del máximo de cada parte (20/40 y 30/60) y la mitad del total (50/100).
 * La parte 2 solo se suma si se aprueba la parte 1.
 */
function resultadoSimulacro({comun = [], especifica = [], supuestos = []}) {
  const EPS = 1e-9;
  const c = puntuar(comun, 0.5), e = puntuar(especifica, 0.5);
  const s = supuestos.map(x => puntuar(x, 3));
  const p1 = {puntos: c.puntos + e.puntos, maximo: c.maximo + e.maximo};
  p1.minimo = p1.maximo / 2;
  p1.existe = p1.maximo > 0;                       // un simulacro reducido podría no tener parte 1
  p1.aprobada = !p1.existe || p1.puntos >= p1.minimo - EPS;
  const p2 = {puntos: s.reduce((a, x) => a + x.puntos, 0), maximo: s.reduce((a, x) => a + x.maximo, 0)};
  p2.minimo = p2.maximo / 2;
  p2.existe = p2.maximo > 0;
  p2.aprobada = !p2.existe || p2.puntos >= p2.minimo - EPS;
  p2.computa = p1.aprobada && p2.existe;
  const maximo = p1.maximo + p2.maximo;
  const total = p1.puntos + (p2.computa ? p2.puntos : 0);
  const minimoTotal = maximo / 2;
  const apto = p1.aprobada && p2.aprobada && total >= minimoTotal - EPS;
  return {comun: c, especifica: e, supuestos: s, p1, p2, total, maximo, minimoTotal, apto};
}

const INF_MIN_RESP = 5;                  // con menos respuestas, el % de un tema todavía no dice nada
/**
 * Reúne los fallos: aciertos por tema y epígrafe, y las preguntas que entran en el informe.
 * @param {object[]} preguntas  las de los bancos activos
 * @param {object} hist  historial por id de pregunta (P.q)
 * @param {{alcance?: ('repaso'|'todas'), dudas?: boolean, temas?: string[]}} op
 *   «repaso»: las que están ahora en tu repaso; «todas»: las que has fallado alguna vez.
 *   dudas: incluir las que solo marcaste con «estaba dudando». temas vacío = todos.
 */
function informeFallos(preguntas, hist, {alcance = 'repaso', dudas = true, temas = []} = {}) {
  const nuevo = extra => ({...extra, total: 0, vistas: 0, n: 0, ok: 0, ko: 0, fallos: 0});
  const porTema = new Map(), porEp = new Map(), lista = [], tot = nuevo({});

    if (!porTema.has(q.tema)) porTema.set(q.tema, nuevo({tema: q.tema}));
    if (!porEp.has(kEp)) porEp.set(kEp, nuevo({tema: q.tema, epigrafe: q.epigrafe}));

    const entra = !!(alcance === 'repaso' ? e.rev : e.ko > 0 || e.dud) && (dudas || !soloDuda);
    for (const s of [tot, porTema.get(q.tema), porEp.get(kEp)]) {
      s.total++;
      if (e.n) { s.vistas++; s.n += e.n; s.ok += e.ok; s.ko += e.ko; }

  const epigrafes = [...porEp.values()].filter(s => s.fallos).map(conPct)
    .sort((a, b) => b.fallos - a.fallos || (a.pct ?? 101) - (b.pct ?? 101) || porTemaOrden(a, b) || collator.compare(a.epigrafe, b.epigrafe));

    sinPracticar: temasL.filter(t => !t.n).sort(porTemaOrden).map(t => t.tema),

      .sort((a, b) => temaOrden(a.q.tema) - temaOrden(b.q.tema) || collator.compare(a.q.epigrafe, b.q.epigrafe) || b.e.ko - a.e.ko || collator.compare(a.q.id, b.q.id)),

function simPlan() {
  const rows = [], usable = [];
  for (const b of LIB.banks.filter(b => b.questions.length || b.twins.length)) {
    if (!b.enabled) rows.push({b, use: false, why: 'Desactivado en Bancos.'});
    else if (!b.questions.length) rows.push({b, use: false, why: 'Sus preguntas son las mismas que las de otro banco cargado; ya entran desde ese, sin repetirse.'});
    else if (b.formato !== 4) rows.push({b, use: false, why: b.formato === 3

  const comun = libres.flatMap(b => b.questions.filter(q => q.bloque === 'C' && eligible(q)));
  const esp = usable.flatMap(b => b.questions.filter(q => q.bloque === 'T' && eligible(q)));

    if (!b.sup[n]) continue;
    const qs = b.questions.filter(q => q.parte === 'supuesto' && q.sup === n && eligible(q)).sort((x, y) => (x.reserva - y.reserva) || x.supPos - y.supPos);
    if (qs.length) sups.push({bank: b.prefix, n, qs});
  }

  if (!ids.length) return toast('✓', 'Nada que repasar', kind === 'due' ? 'Ningún fallo lleva más de 3 días esperando' : 'No tienes fallos pendientes');
  startSession(newSession({kind: 'repaso', title: kind === 'due' ? 'Repaso · más de 3 días' : 'Repaso · mis fallos', immediate: UI.repaso.inmediata,
    parts: [{key: 'p', title: 'Repaso', valor: 1, items: ids}]}));
}
function startSimulacro(oficial) {
  const plan = simPlan();
  if (oficial && !plan.oficial) return;
  const pick = (arr, n) => shuffle(arr).slice(0, n).sort(byExamOrder);
  const p1 = [...pick(plan.comun, 40), ...pick(plan.esp, 40)].map(q => q.id);
  const candidatos = shuffle(plan.llenos.length >= 2 ? plan.llenos : plan.sups).sort((a, b) => Math.min(b.qs.length, 10) - Math.min(a.qs.length, 10));
  const p2 = candidatos.slice(0, 2).flatMap(s => s.qs.slice(0, 10).map(q => q.id));
  if (!p1.length && !p2.length) return;
  const parts = [];
  if (p1.length) parts.push({key: 'p1', title: 'Parte 1 · test', valor: 0.5, timeMin: oficial ? 80 : p1.length, items: p1});
  if (p2.length) parts.push({key: 'p2', title: 'Parte 2 · supuestos', valor: 3, timeMin: oficial ? 70 : Math.ceil(70 * p2.length / 20), items: p2});
  startSession(newSession({kind: 'simulacro', official: oficial, title: oficial ? 'Simulacro oficial' : 'Simulacro reducido · no oficial', immediate: false, parts}));
}

/* Responder, comprobar, moverse, entregar */
function answer(L, kb) {
  const id = curId(), q = LIB.byId.get(id), part = curPart();
  if (!q || !letras(q).includes(L) || part.delivered || (S.immediate && S.checked[id])) return;
  S.ans[id] = L; saveSession(); render({kb});
}
function blank(kb) {
  const id = curId();
  if (S.immediate) { if (S.checked[id]) return; delete S.ans[id]; check(kb); return; }
  delete S.ans[id]; saveSession(); render({kb});
}
function check(kb) {
  const id = curId(), q = LIB.byId.get(id);
  if (!q || S.checked[id]) return;
  const mine = S.ans[id] || null, res = !mine ? 'bl' : mine === q.oficial ? 'ok' : 'ko';
  S.checked[id] = true; S.recorded[id] = true;
  const ev = record(id, res, mine);
  S.run = res === 'ok' ? S.run + 1 : 0;
  saveProgress(); saveSession();
  render({kb, reveal: !kb, focus: 'primary'});
  announce(res === 'ok' ? 'Correcta.' : res === 'ko' ? `Incorrecta. La oficial es la ${q.oficial}.` : `En blanco. La oficial es la ${q.oficial}.`);
  rewards(ev);
}
function rewards(ev) {
  if (ev.sale) toast('★', 'Sale del repaso', 'La has acertado 2 veces seguidas');
  if (S && S.immediate && S.run === 3) toast('3', 'Tres seguidas', 'Sigue así');
  else if (S && S.immediate && S.run > 0 && S.run % 10 === 0) toast(String(S.run), `${S.run} seguidas`, 'Racha de aciertos');
  if (ev.primeraHoy) { const n = streak(); if (n > 1) toast('↑', `Día ${n} de racha`, 'Has estudiado hoy'); }
  if (ev.objetivo) toast('✓', 'Objetivo de hoy cumplido', `${UI.goal} preguntas respondidas`);
}
let moving = false;
function moveTo(i, kb) {
  const part = curPart();
  if (i < 0 || i >= part.items.length || i === S.i) return;
  if (kb || reduceMotion() || moving) { S.i = i; saveSession(); render({kb: true}); return; }
  const card = $('#card');
  if (!card) { S.i = i; saveSession(); render(); return; }
  moving = true; card.classList.add('out');
  setTimeout(() => { S.i = i; saveSession(); moving = false; render({enter: true}); }, 160);
}
function next(kb) {
  const id = curId(), last = S.i === curPart().items.length - 1;
  if (S.immediate) {
    if (!S.checked[id]) { if (S.ans[id]) check(kb); else announce('Elige una opción o déjala en blanco.'); return; }
    if (last) finish(); else moveTo(S.i + 1, kb);
  } else if (!last) moveTo(S.i + 1, kb);
}
function deliverPart(auto) {
  const part = curPart();
  if (part.delivered) return;
  part.delivered = true; part.endAt = null;
  let sale = 0;
  for (const id of part.items) {
    if (S.recorded[id]) continue;
    const q = LIB.byId.get(id); if (!q) continue;
    const m = S.ans[id] || null, ev = record(id, !m ? 'bl' : m === q.oficial ? 'ok' : 'ko', m);
    S.recorded[id] = true; if (ev.sale) sale++;
  }
  saveProgress();
  if (sale) toast('★', plural(sale, 'pregunta sale', 'preguntas salen') + ' del repaso', 'Acertadas 2 veces seguidas');
  if (auto) toast('⏱', 'Tiempo agotado', `${part.title} entregada`);
  if (S.p < S.parts.length - 1) { S.between = true; saveSession(); render(); }
  else finish();
}
function finish() {
  // En práctica se puntúa lo respondido o comprobado; en un examen entregado, todo.
  for (const part of S.parts) {
    if (part.delivered) continue;
    for (const id of part.items) {
      if (S.recorded[id] || !S.ans[id]) continue;
      const q = LIB.byId.get(id); if (!q) continue;
      record(id, S.ans[id] === q.oficial ? 'ok' : 'ko', S.ans[id]); S.recorded[id] = true;
    }
  }
  S.scored = S.kind === 'simulacro' ? S.parts.flatMap(p => p.items) : S.parts.flatMap(p => p.items).filter(id => S.recorded[id]);
  S.done = true; S.finishedAt = Date.now(); S.between = false;
  S.result = computeResult(S);
  if (S.kind === 'simulacro') {
    const r = S.result, prev = P.sims.filter(x => x.oficial === S.official);
    S.mejorAnterior = prev.length ? Math.max(...prev.map(x => x.total)) : null;
    P.sims.push({fecha: S.finishedAt, oficial: S.official, total: r.total, maximo: r.maximo, p1: r.p1.puntos, p2: r.p2.puntos,
      p1ok: r.p1.aprobada, p2ok: r.p2.aprobada, apto: r.apto, preguntas: S.scored.length});
  }
  saveProgress(); saveSession();
  RF = 'todas'; printed = false;
  if (route === 'sesion' || route === 'resultado') go('resultado');
  else toast('✓', S.kind === 'simulacro' ? 'Simulacro entregado' : 'Sesión terminada', 'El resultado está en Inicio');
}
function computeResult(s) {
  const it = id => { const q = LIB.byId.get(id); return q ? {marcada: s.ans[id] || null, oficial: q.oficial} : {marcada: null, oficial: 'ANULADA'}; };
  if (s.kind === 'simulacro') {
    const p1 = s.parts.find(p => p.key === 'p1')?.items || [], p2 = s.parts.find(p => p.key === 'p2')?.items || [];
    const groups = new Map();
    for (const id of p2) { const q = LIB.byId.get(id), k = q ? `${q.bank}#${q.sup}` : '?'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(id); }
    const r = resultadoSimulacro({comun: p1.filter(id => LIB.byId.get(id)?.bloque === 'C').map(it), especifica: p1.filter(id => LIB.byId.get(id)?.bloque !== 'C').map(it),
      supuestos: [...groups.values()].map(a => a.map(it))});
    r.supIds = [...groups.values()].map(a => a[0]);
    return r;
  }
  return puntuar(s.scored.map(it), 1);
}

function tagsHTML(q) {

    q.reserva && `<span class="tag res">Reserva${q.sustituye ? ' · sustituye a una anulada' : ''}</span>`].filter(Boolean).join('');
}
function metaHTML(q) {

}
function optsHTML(q, {mine = null, checked = false, interactive = false} = {}) {

      <span class="k">${L}</span><span class="t">${esc(q[L])}</span><span class="who">${who}</span></button>`;

}
function explainHTML(q, mine, {valor = null} = {}) {
  const res = q.anulada ? 'an' : !mine ? 'bl' : mine === q.oficial ? 'ok' : 'ko', e = P.q[q.id] || {};

  const verdict = {ok: ['var(--ok)', 'Bien'], ko: ['var(--ko)', 'No era esa'], bl: ['var(--ink-2)', 'En blanco'], an: ['var(--ko)', 'Anulada: no puntúa']}[res];
  const estado = q.estado !== 'VIGENTE' ? `<div class="note ${q.estado === 'DUDOSA' ? 'dud' : ''}">
      <div class="lbl">${q.estado === 'DUDOSA' ? 'Marcada como dudosa' : 'Desactualizada · qué ha cambiado'}</div>

  const repaso = e.rev ? `<p class="small" style="margin:10px 0 0">En tu repaso · ${e.racha ? `${e.racha} de 2 aciertos seguidos` : 'sale cuando la aciertes 2 veces seguidas'}.</p>` : '';
  return `<div class="explain"><div class="head"><span class="verdict" style="color:${verdict[0]}">${verdict[1]}${pts}</span>
      <span class="small">Tuya: <b>${mine || '—'}</b> · Oficial: <b>${q.anulada ? 'anulada' : q.oficial}</b></span>
      ${q.anulada ? '' : `<button class="doubt" data-act="doubt" data-id="${esc(q.id)}" aria-pressed="${!!e.dud}"><span class="chk">✓</span>Estaba dudando</button>`}</div>
    ${estado}${repaso}
    <details class="more"><summary>Nota, fuente e id</summary>${q.estado === 'VIGENTE' && q.nota.trim() ? `<p>${esc(q.nota)}</p>` : ''}${q.fuente.trim() ? `<p>${linkify(q.fuente)}</p>` : ''}<p class="muted">${esc(q.id)} · ${esc(q.examen)}</p></details></div>`;
}
function switchHTML(change, checked, title, sub) {

}

const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s % 60); };
const storageNote = () => store.ok ? '' : `<div class="storage-warn">El navegador no deja guardar datos: lo que hagas solo dura mientras esta pestaña siga abierta. Exporta tu progreso en Progreso › Datos antes de cerrarla.</div>`;

/* ---------- Simulacro ---------- */

    <p class="small">Parte 1: 40 preguntas comunes + 40 específicas en 80 minutos (0,5 por acierto, máximo 40, mínimo 20). Parte 2: 2 supuestos de 10 preguntas en 70 minutos (3 por acierto, máximo 60, mínimo 30). Cada fallo resta 1/3 de acierto; los blancos no restan. Apruebas con 50 de 100 y los dos mínimos, y la parte 2 solo cuenta si apruebas la parte 1.</p>

    <p class="small">Supuestos con enunciado: ${supTxt}.</p>
    <h2>Qué preguntas entran</h2>${filtersHTML()}
    <div class="actions" style="margin-top:22px">
    ${plan.oficial ? `<button class="btn big primary" data-act="simOficial">Empezar el simulacro oficial</button><span class="small">150 minutos en total. El reloj corre aunque salgas.</span>`
      : `<div class="warn-box" style="width:100%"><b>No hay preguntas suficientes para un simulacro oficial.</b> ${f.comun + f.esp + f.sups === 1 ? 'Falta' : 'Faltan'} ${[f.comun && plural(f.comun, 'común', 'comunes'), f.esp && plural(f.esp, 'específica', 'específicas'), f.sups && plural(f.sups, 'supuesto completo', 'supuestos completos')].filter(Boolean).join(', ')}. ${!UI.filters.fuera && plan.rows.some(r => r.use && r.b.count.fuera) ? 'Activar «fuera de temario» puede completar la parte 1.' : ''} Carga más bancos de 4 opciones o haz un simulacro reducido, que se marcará como <b>no oficial</b> y no contará en la evolución de tu nota.</div>
        ${hayAlgo ? `<button class="btn big" data-act="simReducido">Hacer un simulacro reducido (no oficial)</button>` : ''}`}
    </div>`;
};

      <div class="field" style="margin-top:4px"><span class="small">El .md:</span>${[['completo', 'Completo, para una IA'], ['breve', 'Breve: pregunta, correcta y la tuya']].map(([v, l]) => `<button class="chip" data-act="infFormato" data-v="${v}" aria-pressed="${o.formato === v}">${l}</button>`).join('')}</div>
      <div class="actions" style="margin-top:8px"><button class="btn primary" data-act="infDescargar" ${r.fallos ? '' : 'disabled'}>Descargar .md</button><button class="btn" data-act="infCopiar" ${r.fallos ? '' : 'disabled'}>Copiar .md</button><button class="btn" data-act="infImprimir" ${r.fallos ? '' : 'disabled'}>Imprimir / PDF</button></div>
    </div>
    <h2>Resumen</h2>
    <div class="card kv"><span>Preguntas en el informe</span><span>${r.fallos}${nSup ? ` · ${nSup} de supuestos` : ''}</span><span>Preguntas vistas</span><span>${r.vistas} de ${r.total} (${pct(r.vistas, r.total)} %)</span>

    ${preguntas ? `<h2>Preguntas falladas · ${inf.preguntas.length}</h2>${preguntas}` : ''}
    ${supuestos ? `<h2>Supuestos prácticos · ${nSup}</h2>${supuestos}` : ''}
    ${r.fallos ? '' : `<p class="small" style="margin-top:18px">${o.alcance === 'repaso' && n.todas ? 'No tienes nada en el repaso con este filtro. Prueba «Falladas alguna vez».' : 'No hay preguntas falladas con este filtro.'}</p>`}`;
};
const informeBreve = () => UI.informe.formato === 'breve';

  const vistas = qs.filter(q => P.q[q.id]?.n).length;
  const tile = t => {
    const s = byT[t];
    if (!s.total) return `<div class="none" title="${t}: sin preguntas en los bancos activos"><b>${t}</b><span>—</span></div>`;
    if (s.pct == null) return `<div class="none" title="${t}: sin responder"><b>${t}</b><span>0 / ${s.total}</span></div>`;
    // Intensidad máxima ~45 %: así el texto mantiene contraste ≥ 4,5 en los dos temas
    const p = s.pct, low = p < 60, bg = low ? `color-mix(in srgb, var(--ko) ${15 + (60 - p) * .5}%, var(--card))` : `color-mix(in srgb, var(--ok) ${12 + (p - 60) * .75}%, var(--card))`;
    return `<div class="${low ? 'low' : ''}" style="background:${bg}" title="${t}: ${Math.round(p)} % de aciertos en ${s.n} respuestas · ${s.vistas} de ${s.total} preguntas vistas"><b>${t}</b><span>${Math.round(p)} %${low ? ' ▼' : ''}</span></div>`;
  };
  const weak = ts.filter(t => t.pct != null && t.pct < 60).sort((a, b) => a.pct - b.pct);
  const sims = P.sims.filter(s => s.oficial), red = P.sims.length - sims.length;
  const due = reviewIds('due').length, all = reviewIds('all').length;
  const dudas = Object.values(P.q).filter(e => e.dud).length;
  return `${storageNote()}<h1>Progreso</h1>
    <div class="top" style="margin-bottom:10px"><div class="num days" style="font-size:clamp(64px,13vw,110px)">${Math.max(0, daysToExam())}<small>días para el 23 de enero de 2027</small></div>
      <div class="streak"><div class="num">${streak()}</div><div class="small">días seguidos · récord ${bestStreak()}</div></div></div>
    <div class="card kv"><span>Preguntas vistas</span><span>${vistas} de ${qs.length} (${pct(vistas, qs.length)} %)</span><span>En repaso</span><span>${all} · ${due} de hace más de 3 días</span><span>Marcadas «estaba dudando»</span><span>${dudas}</span><span>Respondidas hoy</span><span>${P.days[dayKey()] || 0}</span></div>
    <h2>Aciertos por tema · bancos activos</h2>
    <div class="heat">${TEMAS_C.map(tile).join('')}</div><div class="heat t">${TEMAS_T.map(tile).join('')}</div>
    <p class="small" style="margin-top:8px">${weak.length ? `<b style="color:var(--ko)">Por debajo del 60 %:</b> ${weak.map(t => `${t.tema} (${Math.round(t.pct)} %, ${plural(t.n, 'respuesta', 'respuestas')})`).join(' · ')}` : 'Ningún tema por debajo del 60 % con lo respondido hasta ahora.'}</p>
    <p class="small"><a href="#" data-go="informe">Informe de fallos por tema, epígrafe y pregunta (.md o PDF) →</a></p>
    <h2>Simulacros oficiales</h2>
    ${sims.length ? simChart(sims) + `<div class="card" style="margin-top:10px">${sims.slice(-8).reverse().map(s => `<div class="line"><span>${new Date(s.fecha).toLocaleDateString('es-ES', {day: 'numeric', month: 'short', year: 'numeric'})}</span><span class="dots"></span><span><b>${fmt(s.total)}</b> · ${s.apto ? '<span style="color:var(--ok)">apto</span>' : '<span style="color:var(--ko)">no apto</span>'}</span></div>`).join('')}</div>`
      : '<p class="small">Aún no has hecho ningún simulacro oficial. Aquí verás cómo evoluciona tu nota.</p>'}
    ${red ? `<p class="muted">Además, ${plural(red, 'simulacro reducido', 'simulacros reducidos')} (no oficiales) que no cuentan en esta gráfica.</p>` : ''}
    <h2>Datos</h2>
    <div class="card">
      <p><b>Exporta tu progreso</b> a un archivo para no perderlo si limpias el navegador.${WEB ? ' Cada dispositivo guarda el suyo: para pasarlo del ordenador al móvil (o al revés), activa la sincronización de abajo, o exporta en uno e importa en el otro con «Combinar».' : ''}</p>
      ${switchHTML('expBancos', UI.expBancos !== false, 'Incluir los bancos', 'Así puedes restaurarlo todo en otro navegador')}
      <div class="actions"><button class="btn primary" data-act="exportar">Exportar JSON</button><button class="btn" data-act="importar">Importar…</button></div>
      ${WEB ? '<div class="actions"><button class="btn" data-act="bloquear">Olvidar la contraseña en este dispositivo</button><span class="muted">La pedirá al volver a abrir. Tu progreso se queda.</span></div>' : ''}
    </div>
    ${WEB ? nubeHTML() : ''}
    <div class="card" style="margin-top:10px"><b>Tema</b><div class="field">${Object.entries(TEMAS_UI).map(([k, v]) => `<button class="chip" data-act="temaVisual" data-v="${k}" aria-pressed="${UI.tema === k}">${v.txt}</button>`).join('')}<span class="small">«Automático» sigue al sistema</span></div></div>
    <div class="card" style="margin-top:10px"><b>Objetivo diario</b><div class="field">${[10, 20, 30, 50, 80].map(n => `<button class="chip" data-act="goal" data-v="${n}" aria-pressed="${UI.goal === n}">${n}</button>`).join('')}<span class="small">preguntas al día</span></div></div>
    <div class="card" style="margin-top:10px"><div class="row"><b>Pruebas de la puntuación</b><span class="spacer"></span><button class="btn" data-act="tests">Ejecutar</button></div>
      ${TESTS ? `<ul class="tests">${TESTS.map(t => `<li class="${t.ok ? 'pass' : 'fail'}">${t.ok ? '✓' : '✗'} ${esc(t.nombre)}${t.fallos.length ? ` — ${esc(t.fallos.join('; '))}` : ''}</li>`).join('')}</ul><p class="small">${TESTS.filter(t => t.ok).length} de ${TESTS.length} correctas.</p>` : '<p class="small">Comprueba los casos: todo bien, todo mal, todo en blanco, mezcla y anuladas.</p>'}</div>
    <div class="actions" style="margin-top:16px">${holdHTML('borrarProgreso', 'Mantén para borrar todo el progreso', 'Borrando…', 2500, 'danger')}<span class="muted">No borra los bancos.</span></div>`;
};
function simChart(sims) {
  const W = 640, H = 200, L = 34, R = 12, T = 12, B = 26, n = sims.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = v => T + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - T - B);
  const pts = sims.map((s, i) => `${x(i).toFixed(1)},${y(s.total).toFixed(1)}`).join(' ');
  return `<svg class="chart card" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de la nota de los simulacros oficiales">
    ${[0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 50 ? 'var(--ko)' : 'var(--line)'}" stroke-dasharray="${v === 50 ? '4 4' : ''}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
    ${n > 1 ? `<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
    ${sims.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.total)}" r="5" fill="${s.apto ? 'var(--ok)' : 'var(--ko)'}" stroke="var(--card)" stroke-width="2"><title>${new Date(s.fecha).toLocaleDateString('es-ES')}: ${fmt(s.total)}</title></circle>`).join('')}
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${plural(n, 'simulacro', 'simulacros')} · línea roja = 50</text></svg>`;
}

/* ---------- Sesión: la ficha de pregunta ---------- */
VIEWS.sesion = (o = {}) => {
  if (!S) { route = 'inicio'; return VIEWS.inicio(); }
  if (S.done) { route = 'resultado'; return VIEWS.resultado(); }
  const part = curPart();
  if (S.between) {
    const nx = S.parts[S.p + 1], nsup = new Set(nx.items.map(id => { const q = LIB.byId.get(id); return q ? q.bank + q.sup : id; })).size;
    return `<div class="between"><p class="small">${esc(S.title)}</p><h1>${esc(part.title)} entregada</h1>
      <p>Respira. Ahora vienen ${plural(nx.items.length, 'pregunta', 'preguntas')} de ${plural(nsup, 'supuesto', 'supuestos')} y tienes ${nx.timeMin} minutos. El reloj empieza cuando pulses.</p>
      <div class="actions" style="justify-content:center"><button class="btn big primary" data-act="startPart" data-fid="primary">Empezar la ${esc(nx.title.toLowerCase())}</button></div></div>`;
  }
  const id = curId(), q = LIB.byId.get(id), total = part.items.length, last = S.i === total - 1;
  const mine = S.ans[id] || null, checked = S.immediate && S.checked[id];
  const done = S.immediate ? Object.keys(S.checked).filter(k => part.items.includes(k)) : null;
  const okN = done ? done.filter(k => S.ans[k] && S.ans[k] === LIB.byId.get(k)?.oficial).length : 0;
  const right = part.endAt ? `<span class="timer" id="timer" aria-label="Tiempo restante">${fmtTime(part.endAt - Date.now())}</span>`
    : S.immediate ? `<span class="chip" style="margin-left:auto">✓ ${okN} · ✗ ${done.length - okN}</span>` : '<span class="spacer"></span>';
  const bar = `<div class="sbar"><button class="btn ghost" data-act="salir" aria-label="Salir de la sesión" style="padding:6px 10px">✕</button>
    <span class="chip">${esc(S.title)}${S.parts.length > 1 ? ' · ' + esc(part.title) : ''}</span><span>${S.i + 1} de ${total}</span>${right}</div>
    <div class="progress" aria-hidden="true"><i style="transform:scaleX(${(S.i + 1) / total})"></i></div>`;
  if (!q) return bar + `<div class="pile only"><article class="fcard" id="card" tabindex="-1"><p class="qtext">Esta pregunta (${esc(id)}) ya no está en tus bancos.</p><p class="small">Se trata como en blanco y no puntúa.</p>
      <div class="actions"><button class="btn" data-act="prev" ${S.i ? '' : 'disabled'}>←</button><span class="spacer"></span>${primaryHTML(last, false, true)}</div></article></div>`;
  const sup = supuestoDe(q);
  const caseHTML = q.parte === 'supuesto' ? (sup ? `<details class="case" id="case" ${S.caseClosed ? '' : 'open'}><summary><span>Supuesto ${q.sup}${supTitulo(q) ? ' · <span style="font-weight:500">' + esc(supTitulo(q)) + '</span>' : ''}</span><span class="small"></span></summary>
      <div class="body" id="caseBody" tabindex="0" aria-label="Enunciado del supuesto ${q.sup}">${mdToHtml(sup.enunciado)}</div></details>`
    : `<div class="warn-box" style="margin-bottom:14px">Falta el enunciado del supuesto ${q.sup}: carga ${esc(q.bank)}_supuestos.md en Bancos.</div>`) : '';
  return `${bar}${caseHTML}
    <div class="pile ${total - S.i <= 2 ? 'last' : ''}${last ? ' only' : ''}"><article class="fcard${o.kb ? ' kbd' : ''}" id="card" tabindex="-1" aria-label="Pregunta ${S.i + 1} de ${total}">
      <div class="meta">${metaHTML(q)}</div>
      <p class="qtext">${esc(q.pregunta)}</p>
      <div class="opts" role="group" aria-label="Opciones">${optsHTML(q, {mine, checked, interactive: !part.delivered})}</div>
      <div class="reveal ${checked ? 'open' : ''}" id="reveal"><div>${checked ? explainHTML(q, mine, {valor: part.valor}) : ''}</div></div>
      <div class="actions">
        <button class="btn" data-act="prev" data-fid="prev" ${S.i ? '' : 'disabled'} aria-label="Anterior">←</button>
        <button class="btn" data-act="blank" data-fid="blank" ${checked ? 'disabled' : ''}>En blanco</button>
        <button class="btn" data-act="flag" data-fid="flag" aria-pressed="${!!S.flags[id]}">⚑ Revisar</button>
        <span class="spacer"></span>${primaryHTML(last, checked, !!mine)}
      </div></article></div>
    <div class="hint keys">${letras(q).map(L => `<kbd>${L}</kbd>`).join('')} responder · <kbd>←</kbd><kbd>→</kbd> moverse · <kbd>Enter</kbd> ${S.immediate ? 'comprobar / siguiente' : 'siguiente'} · <kbd>M</kbd> marcar para revisar</div>
    ${S.immediate ? '' : sheetHTML()}`;
};
function primaryHTML(last, checked, answered) {
  if (S.immediate) {
    if (!checked) return `<button class="btn primary" data-act="check" data-fid="primary" ${answered ? '' : 'disabled'}>Comprobar</button>`;
    return `<button class="btn primary" data-act="${last ? 'finish' : 'next'}" data-fid="primary">${last ? 'Terminar' : 'Siguiente'}</button>`;
  }
  if (!last) return `<button class="btn primary" data-act="next" data-fid="primary">Siguiente</button>`;
  return holdHTML('deliver', S.p < S.parts.length - 1 ? 'Mantén para entregar la parte' : 'Mantén para entregar', 'Entregando…', 2000);
}
function sheetHTML() {
  const part = curPart(), n = part.items.length;
  const resp = part.items.filter(id => S.ans[id]).length, marc = part.items.filter(id => S.flags[id]).length;
  let prev = null, supIdx = 0;
  const cells = part.items.map((id, i) => {
    const q = LIB.byId.get(id); let sep = '';
    const key = !q ? '?' : q.parte === 'supuesto' ? q.bank + '#' + q.sup : q.bloque;
    if (key !== prev && part.key !== 'p') { sep = `<span class="sep">${!q ? '' : q.parte === 'supuesto' ? `Supuesto ${++supIdx}` : q.bloque === 'C' ? 'Común' : 'Específica'}</span>`; prev = key; }
    const cls = [S.ans[id] && 'a', S.flags[id] && 'f', i === S.i && 'c'].filter(Boolean).join(' ');
    return `${sep}<button class="${cls}" data-act="goto" data-i="${i}" aria-label="Pregunta ${i + 1}${S.ans[id] ? ', respondida' : ''}${S.flags[id] ? ', marcada' : ''}">${i + 1}</button>`;
  }).join('');
  return `<details class="card sheet" id="sheet" ${S.sheetOpen ? 'open' : ''}><summary style="cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b>Hoja de respuestas</b><span class="small">${resp} de ${n} respondidas · ${marc} marcadas para revisar</span></summary>
    <div class="grid80">${cells}</div>
    <div class="actions"><span class="small">${n - resp ? plural(n - resp, 'sin responder', 'sin responder') + ' (cuentan como blanco)' : 'Todas respondidas'}</span><span class="spacer"></span>${holdHTML('deliver', `Mantén para entregar ${esc(part.title.toLowerCase())}`, 'Entregando…', 2000)}</div></details>`;
}

/* ---------- Resultado ---------- */
let RF = 'todas', printed = false;
VIEWS.resultado = () => {
  if (!S || !S.done) { route = 'inicio'; return VIEWS.inicio(); }
  const r = S.result;
  let head;
  if (S.kind === 'simulacro') {
    const fechas = new Date(S.finishedAt).toLocaleDateString('es-ES', {day: 'numeric', month: 'long', year: 'numeric'});
    const line = (lbl, x, v) => `<div class="line"><span>${lbl} · ${x.aciertos} ✓ ${x.fallos} ✗ ${x.blancos} —</span><span class="dots"></span><span>${fmt(v)}</span></div>`;
    const supLines = r.supuestos.map((x, i) => { const q = LIB.byId.get(r.supIds[i]); return line(`Supuesto ${i + 1}${q ? ` (${esc(bankName(bankByPrefix(q.bank) || {org: q.bank}))} S${q.sup})` : ''}`, x, x.puntos); }).join('');
    const mejora = S.official && S.mejorAnterior != null ? (r.total > S.mejorAnterior ? `Tu mejor nota hasta ahora · +${fmt(r.total - S.mejorAnterior)}` : `Tu mejor nota sigue siendo ${fmt(S.mejorAnterior)}`) : S.official ? 'Tu primer simulacro oficial' : '';
    head = `<article class="ticket ${printed || reduceMotion() ? '' : 'print'}" id="ticket">
      <div class="head">${S.official ? '' : '<span class="stamp unofficial">NO OFICIAL · REDUCIDO</span>'}<div class="small">${esc(S.title)} · ${fechas}</div>
        <div class="num total">${fmt(r.total)}<small> /${fmt(r.maximo, 0)}</small></div>
        <div class="stamp ${r.apto ? '' : 'no'}">${r.apto ? 'APTO' : 'NO APTO'}</div>
        ${mejora ? `<div class="small" style="margin-top:10px">${mejora}</div>` : ''}</div>
      <div class="sec"><span>Parte 1 · test</span><span class="num" style="letter-spacing:0">${fmt(r.p1.puntos)} / ${fmt(r.p1.maximo, 0)}</span></div>
      ${line('Común', r.comun, r.comun.puntos)}${line('Específica', r.especifica, r.especifica.puntos)}
      <div class="${r.p1.aprobada ? 'okline' : 'koline'}">${r.p1.aprobada ? '✓' : '✗'} mínimo de ${fmt(r.p1.minimo, r.p1.minimo % 1 ? 2 : 0)} ${r.p1.aprobada ? 'superado' : 'no alcanzado'}</div>
      ${r.p2.existe ? `<div class="sec"><span>Parte 2 · supuestos</span><span class="num" style="letter-spacing:0">${fmt(r.p2.puntos)} / ${fmt(r.p2.maximo, 0)}</span></div>${supLines}
        <div class="${r.p2.computa && r.p2.aprobada ? 'okline' : 'koline'}">${!r.p2.computa ? '✗ No computa: la parte 2 solo cuenta si apruebas la parte 1' : r.p2.aprobada ? `✓ mínimo de ${fmt(r.p2.minimo, r.p2.minimo % 1 ? 2 : 0)} superado` : `✗ mínimo de ${fmt(r.p2.minimo, r.p2.minimo % 1 ? 2 : 0)} no alcanzado`}</div>` : '<div class="sec"><span>Parte 2 · supuestos</span><span>sin supuestos</span></div>'}
      <div class="sec" style="border-top:1px dashed var(--line);padding-top:14px"><span>Total${r.p2.existe && !r.p2.computa ? ' (solo parte 1)' : ''}</span><span class="num" style="letter-spacing:0">${fmt(r.total)}</span></div>
      <p class="muted" style="margin-top:10px">Fallo −1/3 de acierto · blanco 0 · anuladas sin puntuar · hace falta ${fmt(r.minimoTotal, r.minimoTotal % 1 ? 2 : 0)} y los dos mínimos.</p></article>`;
  } else {
    const nota = r.puntuables ? r.netos / r.puntuables * 10 : 0;
    head = `<p class="small">${esc(S.title)}</p><h1>${r.aciertos} de ${r.puntuables} bien</h1>
      <div class="summary"><div class="card"><div class="num" style="color:var(--ok)">${r.aciertos}</div><div class="small">aciertos</div></div><div class="card"><div class="num" style="color:var(--ko)">${r.fallos}</div><div class="small">fallos</div></div>
        <div class="card"><div class="num">${r.blancos}</div><div class="small">en blanco</div></div><div class="card"><div class="num">${fmt(nota)}</div><div class="small">nota sobre 10 (con −1/3)</div></div></div>
      <p class="small">Netos: ${fmt(r.netos)} = ${r.aciertos} − ${r.fallos}/3.${S.scored.length < S.parts[0].items.length ? ` Terminaste antes: se puntúan las ${S.scored.length} que respondiste.` : ''}</p>`;
  }
  const items = S.scored.map((id, i) => ({id, i, q: LIB.byId.get(id)})).filter(x => x.q);
  const filt = {todas: () => true, falladas: x => S.ans[x.id] && S.ans[x.id] !== x.q.oficial && !x.q.anulada, blanco: x => !S.ans[x.id], marcadas: x => S.flags[x.id], dudando: x => P.q[x.id]?.dud, bien: x => S.ans[x.id] === x.q.oficial};
  const n = k => items.filter(filt[k]).length;

  return `${head}
    <div class="actions" style="justify-content:center"><button class="btn primary" data-act="cerrarResultado">Volver al inicio</button>${S.kind === 'simulacro' ? '<button class="btn" data-go="simulacro">Otro simulacro</button>' : ''}</div>
    <h2>Corrección</h2>
    <div class="row">${[['todas', 'Todas'], ['falladas', 'Falladas'], ['blanco', 'En blanco'], ['bien', 'Acertadas'], ['marcadas', 'Marcadas'], ['dudando', 'Dudando']].map(([k, l]) => `<button class="chip" data-act="rf" data-v="${k}" aria-pressed="${RF === k}">${l} · ${n(k)}</button>`).join('')}</div>
    ${list.length ? list.map(({id, i, q}) => `<div class="review-item"><article class="fcard"><div class="meta"><b>${i + 1}.</b>${metaHTML(q)}${S.flags[id] ? '<span class="tag dud">⚑ marcada</span>' : ''}</div>
      ${q.parte === 'supuesto' && supuestoDe(q) ? `<details class="more" style="margin:-6px 0 10px"><summary>Enunciado del supuesto ${q.sup}</summary><div class="case" style="margin-top:8px"><div class="body">${mdToHtml(supuestoDe(q).enunciado)}</div></div></details>` : ''}
      <p class="qtext">${esc(q.pregunta)}</p><div class="opts">${optsHTML(q, {mine: S.ans[id] || null, checked: true})}</div>${explainHTML(q, S.ans[id] || null, {valor: S.parts.find(p => p.items.includes(id))?.valor})}</article></div>`).join('')
      : '<p class="small" style="margin-top:12px">Nada en este filtro.</p>'}`;
};

/* ==========================================================================
   10. NAVEGACIÓN, PESTAÑAS Y RENDER
   ========================================================================== */
let route = 'inicio';
const tabs = $('#tabs'), activeList = tabs.querySelector('.active');
function clipTabs(instant) {
  const btn = tabs.querySelector(`[data-go="${route === 'informe' ? 'repaso' : route}"]`);   // el informe cuelga de Repaso
  activeList.style.transition = instant ? 'none' : '';
  if (!btn) { activeList.style.clipPath = 'inset(0 100% 0 0)'; return; }
  const r = tabs.getBoundingClientRect(), b = btn.getBoundingClientRect();
  activeList.style.clipPath = `inset(0 ${(r.right - b.right).toFixed(1)}px 0 ${(b.left - r.left).toFixed(1)}px round 99px)`;
  tabs.querySelectorAll('[data-go]').forEach(x => x === btn ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
}
function go(r, {instant = false} = {}) {
  if (r === 'sesion' && !S) r = 'inicio';
  route = r; render(); clipTabs(instant);
  window.scrollTo(0, 0);
  if (r !== 'sesion') $('#main').focus({preventScroll: true});
}
function render(o = {}) {
  const fid = document.activeElement?.dataset?.fid;
  const caseScroll = $('#caseBody')?.scrollTop, caseKey = $('#caseBody') ? $('#case summary')?.textContent : null;
  document.body.classList.toggle('focus', route === 'sesion' && S && !S.done);
  $('#main').innerHTML = (VIEWS[route] || VIEWS.inicio)(o);
  if (route === 'resultado') printed = true;
  // Tras pintar: mantener el foco, el scroll del enunciado y las transiciones (solo si no fue con teclado)
  const want = o.focus || fid;
  if (want) $(`[data-fid="${want}"]`)?.focus({preventScroll: true});
  else if (route === 'sesion' && o.kb !== undefined) $('#card')?.focus({preventScroll: true});
  const cb = $('#caseBody');

/* Mete en «raw» un archivo ya leído y devuelve su línea del informe.

function ingestFile(raw, name, text, n, huella) {
  if (/\.csv$/i.test(name)) {

    const p = parseBankCSV(prefix, text);
    if (p.fatal) return {file: name, error: p.fatal};

    return {file: name, prefix, kind: 'csv', replaced: !!old.csv};

  if (!/_supuestos\.md$/i.test(name)) return {file: name, info: 'no es un archivo de supuestos; se ignora.'};
  const prefix = name.replace(/_supuestos\.md$/i, '');

  const old = raw[prefix] || {};
  raw[prefix] = {...old, ...(huella ? {webMd: huella} : {}), md: text, fileMd: name, loadedAt: old.loadedAt || Date.now() + n, enabled: old.enabled !== false};
